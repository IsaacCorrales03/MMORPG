<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Server Monitor</title>
  <style>
    body { font-family: monospace; background: #1e1e1e; color: #ddd; padding: 20px; }
    #stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .card { background: #2a2a2a; padding: 10px 18px; border-radius: 8px; }
    .card.warn { background: #4a2a2a; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #333; font-size: 13px; }
    th { color: #888; }
    #logs { background: #111; padding: 10px; height: 300px; overflow-y: auto; font-size: 13px; }
    .log-line { border-bottom: 1px solid #333; padding: 2px 0; }
    .ping-good { color: #6f6; }
    .ping-mid { color: #fd6; }
    .ping-bad { color: #f66; }
  </style>
</head>
<body>
  <h2>🎮 Server Monitor</h2>
  <div id="stats">
    <div class="card">Jugadores: <span id="jugadores">-</span></div>
    <div class="card" id="tpsCard">TPS: <span id="tps">-</span></div>
    <div class="card">Tick: <span id="tick">-</span></div>
    <div class="card">↑ <span id="kbpsUp">-</span> KB/s</div>
    <div class="card">↓ <span id="kbpsDown">-</span> KB/s</div>
    <div class="card">Estado: <span id="running">-</span></div>
  </div>

  <h3>Jugadores conectados</h3>
  <table>
    <thead>
      <tr><th>ID</th><th>Nombre</th><th>Posición</th><th>Moviéndose</th><th>Ping</th></tr>
    </thead>
    <tbody id="playersBody"></tbody>
  </table>

  <h3>Logs</h3>
  <div id="logs"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <script>
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/monitorHub")
      .withAutomaticReconnect()
      .build();

    function pingClass(ms) {
      if (ms < 80) return "ping-good";
      if (ms < 150) return "ping-mid";
      return "ping-bad";
    }

    connection.on("Stats", (s) => {
      document.getElementById("jugadores").innerText = s.jugadores;
      document.getElementById("tps").innerText = s.tps;
      document.getElementById("tick").innerText = s.tick;
      document.getElementById("kbpsUp").innerText = s.kbpsEnviado.toFixed(1);
      document.getElementById("kbpsDown").innerText = s.kbpsRecibido.toFixed(1);
      document.getElementById("running").innerText = s.running ? "🟢 Activo" : "🔴 Detenido";

      // Alerta visual si el TPS cae del esperado (asumiendo 20 configurado)
      document.getElementById("tpsCard").className = s.tps < 18 ? "card warn" : "card";

      const body = document.getElementById("playersBody");
      body.innerHTML = "";
      s.players.forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.playerId}</td>
          <td>${p.nombre}</td>
          <td>${p.posX.toFixed(1)}, ${p.posY.toFixed(1)}</td>
          <td>${p.moving ? "🏃" : "🧍"}</td>
          <td class="${pingClass(p.pingMs)}">${p.pingMs} ms</td>
        `;
        body.appendChild(row);
      });
    });

    connection.on("Log", (msg) => {
      const logs = document.getElementById("logs");
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logs.appendChild(line);
      logs.scrollTop = logs.scrollHeight;
      // limitar a 200 líneas para no comerse la memoria del navegador
      while (logs.children.length > 200) logs.removeChild(logs.firstChild);
    });

    connection.start().catch(err => console.error(err));
  </script>
</body>
</html>
